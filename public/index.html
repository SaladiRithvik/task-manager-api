<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task Manager</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page">
    <header class="topbar">
      <div class="title-box">
        <h1>Task Manager</h1>
      </div>
      <div id="status-toggles" class="status-toggles">
        <button type="button" class="btn status-toggle active" data-status="todo">Todo</button>
        <button type="button" class="btn status-toggle active" data-status="in_progress">In Progress</button>
        <button type="button" class="btn status-toggle active" data-status="done">Done</button>
      </div>
      <div class="topbar-controls">
        <section id="filters" class="filters">
          <label>
            Priority
            <select id="filter-priority">
              <option value="">All</option>
              <option value="low">Low</option>
              <option value="medium">Medium</option>
              <option value="high">High</option>
            </select>
          </label>
          <label>
            Order by
            <div class="sort-control">
              <select id="sort-by">
                <option value="created" selected>Creation Date</option>
                <option value="due_date">Due Date</option>
                <option value="status">Status</option>
                <option value="priority">Priority</option>
              </select>
              <button type="button" id="sort-direction" class="btn sort-direction-btn" aria-label="Sort direction: ascending" title="Ascending">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <line x1="12" y1="19" x2="12" y2="5"></line>
                  <polyline points="5 12 12 5 19 12"></polyline>
                </svg>
              </button>
            </div>
          </label>
        </section>
        <button type="button" id="new-task-btn" class="btn btn-primary">+ New Task</button>
      </div>
    </header>

    <div id="error-message" class="message hidden"></div>

    <main class="board">
      <div id="task-list-body" class="notes-grid"></div>
    </main>
  </div>

  <div id="create-form-container" class="modal-overlay hidden">
    <div class="modal card modal-create">
      <h2>Add a Task</h2>
      <form id="task-form">
        <div class="field">
          <label for="title">Title</label>
          <input type="text" id="title" name="title" maxlength="200" required />
        </div>
        <div class="field">
          <label for="description">Description</label>
          <textarea id="description" name="description"></textarea>
        </div>
        <div class="field-row">
          <div class="field">
            <label for="status">Status</label>
            <select id="status" name="status">
              <option value="todo" selected>Todo</option>
              <option value="in_progress">In Progress</option>
              <option value="done">Done</option>
            </select>
          </div>
          <div class="field">
            <label for="priority">Priority</label>
            <select id="priority" name="priority">
              <option value="low">Low</option>
              <option value="medium" selected>Medium</option>
              <option value="high">High</option>
            </select>
          </div>
          <div class="field">
            <label for="due_date">Due Date</label>
            <input type="date" id="due_date" name="due_date" />
          </div>
        </div>
        <div class="actions">
          <button type="submit" class="btn btn-primary">Add Task</button>
          <button type="button" id="task-form-cancel" class="btn">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <div id="edit-form-container" class="modal-overlay hidden">
    <div class="modal card">
      <h2>Edit Task</h2>
      <form id="edit-form">
        <input type="hidden" id="edit-id" />
        <div class="field">
          <label for="edit-title">Title</label>
          <input type="text" id="edit-title" maxlength="200" required />
        </div>
        <div class="field">
          <label for="edit-description">Description</label>
          <textarea id="edit-description"></textarea>
        </div>
        <div class="field-row">
          <div class="field">
            <label for="edit-status">Status</label>
            <select id="edit-status">
              <option value="todo">Todo</option>
              <option value="in_progress">In Progress</option>
              <option value="done">Done</option>
            </select>
          </div>
          <div class="field">
            <label for="edit-priority">Priority</label>
            <select id="edit-priority">
              <option value="low">Low</option>
              <option value="medium">Medium</option>
              <option value="high">High</option>
            </select>
          </div>
          <div class="field">
            <label for="edit-due_date">Due Date</label>
            <input type="date" id="edit-due_date" />
          </div>
        </div>
        <div class="actions">
          <button type="submit" class="btn btn-primary">Save</button>
          <button type="button" id="edit-cancel" class="btn">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
