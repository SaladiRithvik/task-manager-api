<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task Manager</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page">
    <header class="topbar">
      <h1>Task Manager</h1>
      <div class="topbar-controls">
        <section id="filters" class="filters">
          <label>
            Status
            <select id="filter-status">
              <option value="">All</option>
              <option value="todo">Todo</option>
              <option value="in_progress">In Progress</option>
              <option value="done">Done</option>
            </select>
          </label>
          <label>
            Priority
            <select id="filter-priority">
              <option value="">All</option>
              <option value="low">Low</option>
              <option value="medium">Medium</option>
              <option value="high">High</option>
            </select>
          </label>
          <label>
            Order by
            <select id="sort-by">
              <option value="default" selected>Newest</option>
              <option value="due_date">Due Date</option>
              <option value="status">Status</option>
              <option value="priority">Priority</option>
            </select>
          </label>
        </section>
        <button type="button" id="new-task-btn" class="btn btn-primary">+ New Task</button>
      </div>
    </header>

    <div id="error-message" class="message hidden"></div>

    <main class="board">
      <div id="task-list-body" class="notes-grid"></div>
    </main>
  </div>

  <div id="create-form-container" class="modal-overlay hidden">
    <div class="modal card modal-create">
      <h2>Add a Task</h2>
      <form id="task-form">
        <div class="field">
          <label for="title">Title</label>
          <input type="text" id="title" name="title" maxlength="200" required />
        </div>
        <div class="field">
          <label for="description">Description</label>
          <textarea id="description" name="description"></textarea>
        </div>
        <div class="field-row">
          <div class="field">
            <label for="status">Status</label>
            <select id="status" name="status">
              <option value="todo" selected>Todo</option>
              <option value="in_progress">In Progress</option>
              <option value="done">Done</option>
            </select>
          </div>
          <div class="field">
            <label for="priority">Priority</label>
            <select id="priority" name="priority">
              <option value="low">Low</option>
              <option value="medium" selected>Medium</option>
              <option value="high">High</option>
            </select>
          </div>
          <div class="field">
            <label for="due_date">Due Date</label>
            <input type="date" id="due_date" name="due_date" />
          </div>
        </div>
        <div class="actions">
          <button type="submit" class="btn btn-primary">Add Task</button>
          <button type="button" id="task-form-cancel" class="btn">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <div id="edit-form-container" class="modal-overlay hidden">
    <div class="modal card">
      <h2>Edit Task</h2>
      <form id="edit-form">
        <input type="hidden" id="edit-id" />
        <div class="field">
          <label for="edit-title">Title</label>
          <input type="text" id="edit-title" maxlength="200" required />
        </div>
        <div class="field">
          <label for="edit-description">Description</label>
          <textarea id="edit-description"></textarea>
        </div>
        <div class="field-row">
          <div class="field">
            <label for="edit-status">Status</label>
            <select id="edit-status">
              <option value="todo">Todo</option>
              <option value="in_progress">In Progress</option>
              <option value="done">Done</option>
            </select>
          </div>
          <div class="field">
            <label for="edit-priority">Priority</label>
            <select id="edit-priority">
              <option value="low">Low</option>
              <option value="medium">Medium</option>
              <option value="high">High</option>
            </select>
          </div>
          <div class="field">
            <label for="edit-due_date">Due Date</label>
            <input type="date" id="edit-due_date" />
          </div>
        </div>
        <div class="actions">
          <button type="submit" class="btn btn-primary">Save</button>
          <button type="button" id="edit-cancel" class="btn">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
