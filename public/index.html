<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task Manager</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>Task Manager</h1>
    </header>

    <div id="error-message" class="message hidden"></div>

    <section id="filters" class="filters">
      <label>
        Status
        <select id="filter-status">
          <option value="">All</option>
          <option value="todo">Todo</option>
          <option value="in_progress">In Progress</option>
          <option value="done">Done</option>
        </select>
      </label>
      <label>
        Priority
        <select id="filter-priority">
          <option value="">All</option>
          <option value="low">Low</option>
          <option value="medium">Medium</option>
          <option value="high">High</option>
        </select>
      </label>
    </section>

    <section class="card">
      <h2>Add a Task</h2>
      <form id="task-form">
        <div class="field">
          <label for="title">Title</label>
          <input type="text" id="title" name="title" maxlength="200" required />
        </div>
        <div class="field">
          <label for="description">Description</label>
          <textarea id="description" name="description"></textarea>
        </div>
        <div class="field-row">
          <div class="field">
            <label for="status">Status</label>
            <select id="status" name="status">
              <option value="todo" selected>Todo</option>
              <option value="in_progress">In Progress</option>
              <option value="done">Done</option>
            </select>
          </div>
          <div class="field">
            <label for="priority">Priority</label>
            <select id="priority" name="priority">
              <option value="low">Low</option>
              <option value="medium" selected>Medium</option>
              <option value="high">High</option>
            </select>
          </div>
          <div class="field">
            <label for="due_date">Due Date</label>
            <input type="date" id="due_date" name="due_date" />
          </div>
        </div>
        <button type="submit" class="btn btn-primary">Add Task</button>
      </form>
    </section>

    <section class="card">
      <h2>Tasks</h2>
      <div class="table-wrapper">
        <table id="task-list">
          <thead>
            <tr>
              <th>Title</th>
              <th>Description</th>
              <th>Status</th>
              <th>Priority</th>
              <th>Due Date</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="task-list-body"></tbody>
        </table>
      </div>
    </section>

    <div id="edit-form-container" class="card hidden">
      <h2>Edit Task</h2>
      <form id="edit-form">
        <input type="hidden" id="edit-id" />
        <div class="field">
          <label for="edit-title">Title</label>
          <input type="text" id="edit-title" maxlength="200" required />
        </div>
        <div class="field">
          <label for="edit-description">Description</label>
          <textarea id="edit-description"></textarea>
        </div>
        <div class="field-row">
          <div class="field">
            <label for="edit-status">Status</label>
            <select id="edit-status">
              <option value="todo">Todo</option>
              <option value="in_progress">In Progress</option>
              <option value="done">Done</option>
            </select>
          </div>
          <div class="field">
            <label for="edit-priority">Priority</label>
            <select id="edit-priority">
              <option value="low">Low</option>
              <option value="medium">Medium</option>
              <option value="high">High</option>
            </select>
          </div>
          <div class="field">
            <label for="edit-due_date">Due Date</label>
            <input type="date" id="edit-due_date" />
          </div>
        </div>
        <div class="actions">
          <button type="submit" class="btn btn-primary">Save</button>
          <button type="button" id="edit-cancel" class="btn">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
